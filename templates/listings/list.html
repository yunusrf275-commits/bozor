

{% extends 'base.html' %}

{% block content %}
    <h1 class="mb-4">Объявления</h1>
    <a href="{% url 'listings:create' %}" class="btn btn-primary mb-4">+ Подать объявление</a>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4" id="listingsContainer" data-next-page="2" data-location="{{ location_id }}">
        {% include 'listings/_listing_cards.html' %}
    </div>

    {% if page_obj.has_next %}
        <div id="listingsScrollTrigger" class="text-center py-4">
            <div class="spinner-border text-secondary" role="status"></div>
        </div>
    {% endif %}
{% endblock %}
