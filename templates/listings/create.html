

{% extends 'base.html' %}

{% block content %}
    <h1 class="mb-4">Подать объявление</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="col-md-6">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Заголовок</label>
            <input type="text" name="title" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Категория</label>
            <select name="category" class="form-select" required>
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Цена</label>
            <input type="number" step="0.01" name="price" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Область</label>
            <select id="regionSelect" class="form-select mb-2" required>
                <option value="">Выберите область</option>
                {% for region in regions %}
                    <option value="{{ region.id }}">{{ region.name }}</option>
                {% endfor %}
            </select>

            <label class="form-label">Район</label>
            <select id="districtSelect" name="location" class="form-select" required disabled>
                <option value="">Сначала выберите область</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea name="description" class="form-control" rows="4"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Телефон для связи</label>
            <input type="tel" name="phone" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Фото</label>
            <input type="file" name="images" class="form-control" multiple accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary">Отправить на проверку</button>
    </form>
{% endblock %}
