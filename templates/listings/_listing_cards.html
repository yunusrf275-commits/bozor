

{% for listing in listings %}
    <div class="col">
        <div class="card h-100">
            {% with listing.images.first as first_image %}
                {% if first_image %}
                    <img src="{{ first_image.image.url }}" class="card-img-top" style="height: 180px; object-fit: cover;">
                {% endif %}
            {% endwith %}
            <div class="card-body">
                <h6 class="card-title">{{ listing.title }}</h6>
                <p class="card-text fw-bold">{{ listing.price }} сум</p>
                <p class="card-text text-muted small">{{ listing.location.name }}</p>
            </div>
        </div>
    </div>
{% empty %}
    <p>Объявлений пока нет.</p>
{% endfor %}
