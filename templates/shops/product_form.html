

{% extends 'base.html' %}

{% block content %}
    <h1>{% if product %}Редактировать товар{% else %}Добавить товар{% endif %}</h1>

    <form method="post" enctype="multipart/form-data" class="col-md-6">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" name="name" class="form-control" value="{{ product.name|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Категория</label>
            <select name="category" class="form-select" required>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Цена</label>
            <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Скидка (%)</label>
            <input type="number" name="discount_percent" class="form-control" value="{{ product.discount_percent|default:0 }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Количество на складе</label>
            <input type="number" name="stock_quantity" class="form-control" value="{{ product.stock_quantity|default:0 }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea name="description" class="form-control" rows="4">{{ product.description|default:'' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Фото (можно выбрать несколько)</label>
            <input type="file" name="images" class="form-control" multiple accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'shops:dashboard' shop.id %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
{% endblock %}
