

{% extends 'base.html' %}

{% block content %}
    <h1>Удалить товар?</h1>
    <p>Вы уверены, что хотите удалить "<strong>{{ product.name }}</strong>"? Это действие необратимо.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'shops:products' shop.id %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
{% endblock %}
